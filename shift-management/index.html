<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Status bar / title bar color for the installed app, following the
       device's light / dark mode straight from static HTML: an installed
       Android app may ignore a color changed later by JS, while the status
       bar icons always follow the device theme — a white bar on a dark device
       hides the icons. Only when the user explicitly picks Light / Dark /
       OLED dark, and only on desktop, do the script below and ThemeContext
       override both tags (so the window title bar matches the header). -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1f1f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Team Board" />
  <title>Thinkmay Team Board</title>
  <!-- Applies the saved theme before first paint so dark / OLED dark don't
       flash white. Mirrors src/theme/ThemeContext.tsx (storage key, colors,
       device detection) — change one, change both. -->
  <script>
    (function () {
      var pref = null
      try {
        pref = localStorage.getItem('scheduler.theme')
      } catch (e) { }
      var oled = pref === 'oled'
      var dark =
        pref === 'dark' ||
        oled ||
        (pref !== 'light' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      if (oled) document.documentElement.dataset.oled = ''
      // When following the device, or on a phone / tablet (Android, iOS,
      // iPadOS), the two theme-color tags above are already right — leave
      // them alone. Same colors and device detection as ThemeContext.tsx.
      var ua = navigator.userAgent
      var mobile =
        /Android|iPhone|iPad|iPod/.test(ua) ||
        (ua.indexOf('Macintosh') !== -1 && navigator.maxTouchPoints > 1)
      if ((pref === 'light' || pref === 'dark' || oled) && !mobile) {
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', oled ? '#000000' : dark ? '#1f1f1f' : '#ffffff')
        })
      }
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- special thanks to claude -->
</body>

</html>
